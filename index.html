<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa interativo – Unifametro</title>
<style>
:root{--bg:#f6f1f4;--surface:#fff;--ink:#241420;--muted:#6b5663;--line:#e0d3da;--brand:#7d1252;--brand-ink:#fff;--soft:#f3e3ec;--you:#1456d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150d13;--surface:#231820;--ink:#f5e9f0;--muted:#bda5b3;--line:#3b2a35;--brand:#e06aa8;--brand-ink:#1a0b13;--soft:#3a2231;--you:#6ea0ff}}
:root[data-theme="dark"]{--bg:#150d13;--surface:#231820;--ink:#f5e9f0;--muted:#bda5b3;--line:#3b2a35;--brand:#e06aa8;--brand-ink:#1a0b13;--soft:#3a2231;--you:#6ea0ff}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:1.35rem;margin:0}
header{padding:14px 16px 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
main{display:grid;gap:14px;padding:10px 16px 28px;max-width:1180px;margin:auto}
@media(min-width:900px){main{grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);align-items:start}}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-bottom:1px solid var(--line);align-items:center}
.btn{min-height:44px;min-width:44px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:600}
.btn[aria-pressed="true"]{background:var(--you);color:#fff;border-color:var(--you)}
.vp{overflow:auto;max-height:70vh;background:#fff;border-radius:0 0 14px 14px}
.stage{position:relative;width:100%;line-height:0}
.stage img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.stage.pick{cursor:crosshair}
.pin{position:absolute;transform:translate(-50%,-100%);width:34px;height:44px;pointer-events:none}
.pin svg{width:100%;height:100%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.pin.pulse::after{content:"";position:absolute;left:50%;bottom:-6px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#7d1252;opacity:.35;animation:p 1.6s ease-out infinite}
@keyframes p{to{transform:scale(3);opacity:0}}
@media(prefers-reduced-motion:reduce){.pin.pulse::after{animation:none}}
.you{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:#1456d6;border:3px solid #fff;box-shadow:0 0 0 3px rgba(20,86,214,.35);pointer-events:none}
.panel{padding:12px}
.search{width:100%;min-height:48px;padding:0 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.info{border-left:5px solid var(--brand);background:var(--soft);padding:10px 12px;border-radius:8px;margin:6px 0 12px}
.info strong{display:block;font-size:1.05rem}
.info small{color:var(--muted)}
details{border-top:1px solid var(--line)}
summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:700}
.items{list-style:none;margin:0 0 8px;padding:0}
.items li button{width:100%;text-align:left;min-height:44px;padding:8px 10px;border:0;background:none;border-radius:8px}
.items li button:hover,.items li button[aria-current="true"]{background:var(--soft)}
.empty{padding:14px;color:var(--muted)}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 8px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Mapa da Unifametro</h1>
    <p>Busque uma sala, laboratório ou serviço e veja onde ir.</p>
  </div>
  <button class="btn" id="tema" type="button" aria-label="Alternar tema claro e escuro">◐</button>
</header>

      <button class="btn" id="aqui" type="button" aria-pressed="false">Marcar onde estou</button>
    </div>
    <div class="vp" id="vp">

var P=[],id=0;
S.forEach(function(s){P.push({id:id++,n:s[0],g:"S",sub:"Serviço no térreo",x:s[1],y:s[2],ref:s[0]})});
F.forEach(function(f){var pt=f[0]==="A"?EA:EB,el=f[0]==="A"?"Elevador do Bloco A":"Elevador do Bloco B";
f[2].forEach(function(n){P.push({id:id++,n:n,g:f[0],grp:"Bloco "+f[0]+" · "+f[1],sub:"Bloco "+f[0]+", "+f[1],x:pt.x,y:pt.y,ref:el,andar:f[1],r:(n.indexOf("Sala")>-1&&f[3])?f[3]:null})})});
var $=function(i){return document.getElementById(i)},st=$("stage"),vp=$("vp"),zoom=1,sel=null,pin=null,you=null,picking=false,filt="todos";
function norm(t){return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function match(p,q){if(!q)return true;var n=parseInt(q,10);if(!isNaN(n)&&/^\d+$/.test(q)&&p.r)return n>=p.r[0]&&n<=p.r[1];return norm(p.n+" "+(p.sub||"")).indexOf(norm(q))>-1}
function render(){var q=$("q").value.trim(),h="",gr={},ord=[];
P.forEach(function(p){if(filt!=="todos"&&p.g!==filt)return;if(!match(p,q))return;var k=p.g==="S"?"Serviços e áreas comuns":p.grp;if(!gr[k]){gr[k]=[];ord.push(k)}gr[k].push(p)});
if(!ord.length){$("lista").innerHTML='<p class="empty">Nada encontrado para “'+q.replace(/</g,"&lt;")+'”. Tente outro nome ou número de sala.</p>';return}
ord.forEach(function(k,i){h+='<details'+((q||filt!=="todos"||i===0)?" open":"")+'><summary>'+k+'</summary><ul class="items">';
gr[k].forEach(function(p){h+='<li><button type="button" data-id="'+p.id+'"'+(sel===p.id?' aria-current="true"':"")+'>'+p.n+'</button></li>'});h+="</ul></details>"});
$("lista").innerHTML=h}
function setZoom(z){zoom=Math.max(1,Math.min(3,z));st.style.width=(zoom*100)+"%"}
function place(el,x,y){el.style.left=x+"%";el.style.top=y+"%"}
function choose(i){var p=P[i];sel=i;if(pin)pin.remove();
pin=document.createElement("div");pin.className="pin pulse";pin.innerHTML='<svg viewBox="0 0 34 44" aria-hidden="true"><path d="M17 43C17 43 3 27 3 16a14 14 0 0 1 28 0c0 11-14 27-14 27z" fill="#7d1252" stroke="#fff" stroke-width="2.5"/><circle cx="17" cy="16" r="5.5" fill="#fff"/></svg>';
place(pin,p.x,p.y);st.appendChild(pin);
var t=p.g==="S"?"Veja o ponto marcado no mapa.":"Esta área fica no <b>"+p.andar+"</b> do Bloco "+p.g+". O pino mostra o <b>"+p.ref.toLowerCase()+"</b>: suba por ele até o "+p.andar.toLowerCase()+".";
$("info").innerHTML="<strong>"+p.n+"</strong><small>"+p.sub+"</small><p style='margin:6px 0 0'>"+t+"</p>";
if(zoom===1)setZoom(1.6);
var r=st.getBoundingClientRect();vp.scrollTo({left:p.x/100*st.offsetWidth-vp.clientWidth/2,top:p.y/100*st.offsetHeight-vp.clientHeight/2,behavior:"smooth"});
render()}
$("lista").addEventListener("click",function(e){var b=e.target.closest("button[data-id]");if(b)choose(+b.dataset.id)});
$("q").addEventListener("input",render);
document.querySelectorAll(".chip").forEach(function(c){c.addEventListener("click",function(){filt=c.dataset.f;document.querySelectorAll(".chip").forEach(function(o){o.setAttribute("aria-pressed",o===c?"true":"false")});render()})});
$("zp").onclick=function(){setZoom(zoom+.5)};$("zm").onclick=function(){setZoom(zoom-.5)};$("zr").onclick=function(){setZoom(1);vp.scrollTo(0,0)};
$("aqui").onclick=function(){picking=!picking;this.setAttribute("aria-pressed",picking);this.textContent=picking?"Toque no mapa…":"Marcar onde estou";st.classList.toggle("pick",picking)};
st.addEventListener("click",function(e){if(!picking)return;var r=st.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;
if(!you){you=document.createElement("div");you.className="you";you.setAttribute("title","Você está aqui");st.appendChild(you)}
place(you,x,y);picking=false;var b=$("aqui");b.setAttribute("aria-pressed","false");b.textContent="Mover minha posição";st.classList.remove("pick")});
$("tema").onclick=function(){var r=document.documentElement,d=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);r.setAttribute("data-theme",d?"light":"dark")};
render();
</script>
